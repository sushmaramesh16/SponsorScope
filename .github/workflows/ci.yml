name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest
        run: pytest -q

      - name: dbt build on a fixture snapshot (no network)
        env:
          PYTHONPATH: ${{ github.workspace }}
          SPONSORSCOPE_DB: ${{ runner.temp }}/ci.duckdb
        run: |
          mkdir -p data/raw/postings/snapshot_date=2026-10-07
          cp tests/fixtures/postings_sample.parquet data/raw/postings/snapshot_date=2026-10-07/postings.parquet
          dbt build --project-dir dbt --profiles-dir dbt
