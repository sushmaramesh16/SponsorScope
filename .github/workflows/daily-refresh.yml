name: Daily refresh

on:
  schedule:
    - cron: "17 11 * * *"  # 11:17 UTC daily (~7 am US Eastern)
  workflow_dispatch:

permissions:
  contents: write  # commit the refreshed app data

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -q

      - name: Ingest -> dbt build (tests included) -> export
        run: python -m pipeline.run

      - name: Commit updated app data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/app data/history
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Daily data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
