[project]
name = "sponsorscope"
version = "0.1.0"
description = "Live US data/ML and software job postings flagged by employer H-1B sponsorship history."
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["dbt/target", "dbt/logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # en dashes etc. in regexes/docs are intentional

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # real-world phrasings are kept verbatim
